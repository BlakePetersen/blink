name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: cli/blink-tui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: cli/blink-tui/pnpm-lock.yaml

      - name: Install dependencies
        run: cd cli/blink-tui && pnpm install --frozen-lockfile

      - name: Run tests
        run: cd cli/blink-tui && pnpm test

      - name: Build
        run: cd cli/blink-tui && pnpm build

  bash-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run snapshot tests
        run: ./tests/test-create-snapshot.sh

      - name: Run session-start hook tests
        run: ./tests/test-session-start-hook.sh
